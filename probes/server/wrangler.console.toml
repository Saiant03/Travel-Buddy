name = "travel-buddy-server-probe"
main = "./console-worker.ts"
compatibility_date = "2026-10-23"
workers_dev = true

[assets]
directory = "../../dist-server-probe"
binding = "ASSETS"
run_worker_first = ["/probe/*"]

[vars]
FIREBASE_PROJECT_ID = "travel-buddy-local-probe.invalid"
FIREBASE_WEB_API_KEY = ""
ALLOWED_UID_1 = "synthetic-uid-alpha"
ALLOWED_UID_2 = "synthetic-uid-beta"

[[d1_databases]]
binding = "DB"
database_name = "travel-buddy-server-probe"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../migrations"
