name = "travel-buddy-server-probe"
main = "./console-worker.ts"
compatibility_date = "2026-10-23"
workers_dev = true

[assets]
directory = "../../dist-server-probe"
binding = "ASSETS"
run_worker_first = ["/probe/*"]

# Firebase project and allowlist values are supplied privately in the
# Cloudflare Dashboard. Do not add them, or the Web API key, to this file.
# Do not deploy this repository config until all required private values and
# bindings have been reviewed in the target Worker environment.

[[d1_databases]]
binding = "DB"
database_name = "travel-buddy-server-probe"
database_id = "b6deb718-ad18-43f8-8649-95e3ed861aaf"
migrations_dir = "../migrations"
